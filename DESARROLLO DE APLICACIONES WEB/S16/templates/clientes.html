{% extends 'base.html' %}{% block title %}Clientes{% endblock %}{% block content %}<div class="container py-5"><div class="d-flex justify-content-between mb-4"><h1>Clientes</h1><a class="btn btn-primary" href="{{ url_for('nuevo_cliente') }}">+ Nuevo cliente</a></div><div class="table-responsive"><table class="table table-striped"><thead><tr><th>Nombre</th><th>Documento</th><th>Teléfono</th><th>Tipo</th><th>Acciones</th></tr></thead><tbody>{% for c in clientes %}<tr><td>{{ c.nombre }}</td><td>{{ c.documento }}</td><td>{{ c.telefono }}</td><td>{{ c.tipo }}</td><td class="text-nowrap"><a class="btn btn-sm btn-outline-primary" href="{{ url_for('editar_cliente', id=c.id_cliente) }}">Editar</a><form class="d-inline" method="post" action="{{ url_for('eliminar_cliente', id=c.id_cliente) }}"><button class="btn btn-sm btn-outline-danger" onclick="return confirm('¿Eliminar este cliente?')">Eliminar</button></form></td></tr>{% else %}<tr><td colspan="5">No hay clientes.</td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
